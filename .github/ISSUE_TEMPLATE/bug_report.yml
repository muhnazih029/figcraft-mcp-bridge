name: Bug report
description: Report a problem with the bridge or the FigCraft tools
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill this in with the state at the time of the error.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the output of `figcraft_status` and the last 10 log lines.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "For example: Bun 1.4.2, FigCraft 0.18.1, OpenCode 1.x"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
